name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Prepare web directory
        run: |
          mkdir -p www
          cp -r ./* www/ 2>/dev/null || true
          # تأكد من وجود index.html في www
          if [ ! -f www/index.html ]; then echo "Error: index.html not found"; exit 1; fi

      - name: Install Capacitor
        run: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android

      - name: Init Capacitor
        run: npx cap init SerenMind com.serenmind.app --web-dir=www

      - name: Add Android
        run: npx cap add android

      - name: Copy web files
        run: npx cap copy

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SerenMind-App
          path: android/app/build/outputs/apk/debug/*.apk
