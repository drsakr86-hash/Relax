name: Deploy Meditation App to GitHub Pages

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write   # هذا يمنح حق الدفع إلى gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./          # المجلد الذي يحتوي على ملف index.html
          publish_branch: gh-pages
          force_orphan: true       # ✅ بدلاً من force_ord
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: تحديث تلقائي للتطبيق'
